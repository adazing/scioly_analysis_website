{% extends 'main.html' %}
{% load crispy_forms_tags %}
{% block bodycontent %}
<div class="form-control border border-success border-5" id = "requirement_additions">
    <form method="POST" id = "requirement_additions_form">
        Add Requirements:
        <br><br>
        
        <div class="container text-center">
            <div class="row align-items-start">
                <div class="col h5">
                    Member
                </div>
                <div class="col h5">
                    Event
                </div>
            </div>

            <div class="row align-items-start">
            <div class="col">
                <select class="form-select">
                    {% for m in members_list %}
                    <option value="{{m.id}}" {% if m.required_team != None %} disabled {% endif %}>{{m}}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col">
                <select class="form-select">
                    <option value="">None</option>
                    {% for e in events_list %}
                    <option value="{{e.id}}">{{e}}</option>
                    {% endfor %}
                </select>
            </div>
            </div>
        </div>
        <br>
        <div id="requirements_list">
            {% for m in requirements_list %}
                <div class="card">
                    <div class="card-body">
                        <div class="container text-center">
                            <div class="row align-items-start">
                                <div class="col h5">
                                    {{m}}
                                </div>
                                <div class="col h5">
                                    {{m.required_event}}
                                </div>
                            </div>                
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
        <div class="text-center">
            <input type="submit" value="Add" class="btn btn-secondary" form="general_team_settings">
        </div>
    </form>
</div>

{% endblock %}
