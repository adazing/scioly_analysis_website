{% extends "main.html" %}
{% load crispy_forms_tags %}

{% block title %}Sign Up{% endblock %}

{% block bodycontent %}
<div class="formblock">
  {% if user.is_authenticated %}
  <h4>You are already logged in. Would you like to <a href="{% url 'logoutView' %}">log out?</a> </h4>
  {% else %}
  <h2>Sign up</h2>
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">Sign Up</button>
  </form>
  {% endif %}
</div>
{% endblock %}
