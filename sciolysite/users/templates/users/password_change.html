{% extends "main.html" %}
{% load crispy_forms_tags %}

{% block title %}Change Password{% endblock %}

{% block bodycontent %}
<div class="formblock">
<h2>Change Password</h2>
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">Change Password</button>
  </form>
</div>
{% endblock %}
